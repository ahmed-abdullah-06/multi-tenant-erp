<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login API</title>
</head>
<body>
    <h1>Test Login API</h1>
    <button id="testBtn">Test Login API</button>
    <pre id="output"></pre>

    <script>
        document.getElementById('testBtn').addEventListener('click', async () => {
            const output = document.getElementById('output');
            output.textContent = 'Testing API connection...\n';

            try {
                // Test 1: Health check
                output.textContent += '\n1. Testing health endpoint...\n';
                const healthRes = await fetch('/health');
                const healthData = await healthRes.json();
                output.textContent += `   ✓ Health check: ${JSON.stringify(healthData)}\n`;

                // Test 2: Login API
                output.textContent += '\n2. Testing login endpoint...\n';
                const loginRes = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@demo.com',
                        password: 'admin123'
                    })
                });

                output.textContent += `   Response status: ${loginRes.status}\n`;
                const loginData = await loginRes.json();
                output.textContent += `   Response: ${JSON.stringify(loginData, null, 2)}\n`;

                if (loginRes.ok) {
                    output.textContent += '\n✓ Login successful!\n';
                } else {
                    output.textContent += '\n✗ Login failed\n';
                }

            } catch (error) {
                output.textContent += `\n✗ ERROR: ${error.message}\n`;
                output.textContent += `   ${error.stack}\n`;
            }
        });
    </script>
</body>
</html>
