<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise ERP SaaS - Dashboard</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="auth-shell">
    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>

    <main class="main-content">
      <div class="page-container">
        <!-- Content injected dynamically based on navigation -->
        <div id="view-container">
          <div style="text-align: center; padding: 4rem;">
            <h2>Loading workspace...</h2>
          </div>
        </div>
      </div>
    </main>
  </div>
  <!-- client/dashboard.html -->
<div class="glass-panel border-red-500/20 p-6 rounded-xl relative overflow-hidden">
  <!-- Dynamic content injects here -->
  <header class="mb-8">
    <h1 class="text-3xl font-bold text-red-500 tracking-wider">SYSTEM LOGISTICS</h1>
    <p id="role-badge" class="text-sm text-red-400/70 font-mono mt-1"></p>
  </header>
  
  <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <!-- Widgets rendered via JS -->
  </div>
</div>

  <script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
