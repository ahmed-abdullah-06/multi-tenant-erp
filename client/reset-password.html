<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ERP SaaS</title>
    <!-- Use the exact same <style> block from forgot-password.html here -->
    <style>
        /* (Insert identical CSS from above to maintain consistency) */
        :root { --bg-color: #0b0b10; --panel-bg: rgba(20, 20, 32, 0.65); --border-color: #2a2a3a; --text-main: #e0e0e0; --text-muted: #888899; --accent-red: #d32f2f; --accent-glow: 0 0 12px rgba(211, 47, 47, 0.6); --success-green: #00e676; }
        body { background-color: var(--bg-color); background-image: linear-gradient(rgba(211, 47, 47, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(211, 47, 47, 0.03) 1px, transparent 1px); background-size: 30px 30px; color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; justify-content: center; align-items: center; }
        .auth-panel { background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 8px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); text-align: center; }
        h2 { color: #fff; margin-top: 0; margin-bottom: 10px; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; background: #0b0b10; border: 1px solid var(--border-color); color: white; border-radius: 4px; box-sizing: border-box; transition: all 0.3s; }
        input:focus { outline: none; border-color: var(--accent-red); box-shadow: 0 0 5px rgba(211, 47, 47, 0.3); }
        .btn-primary { width: 100%; background: transparent; color: var(--accent-red); border: 1px solid var(--accent-red); padding: 12px; border-radius: 4px; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; font-size: 0.9rem; font-weight: bold; letter-spacing: 1px; }
        .btn-primary:hover { background: var(--accent-red); color: white; box-shadow: var(--accent-glow); }
        .link { color: var(--text-muted); font-size: 0.85rem; text-decoration: none; display: inline-block; margin-top: 20px; transition: color 0.3s; }
        .link:hover { color: var(--accent-red); }
        #message { margin-top: 15px; font-size: 0.9rem; display: none; }
        .text-green { color: var(--success-green); }
        .text-red { color: var(--accent-red); }
    </style>
</head>
<body>

    <div class="auth-panel">
        <h2>Establish New Credentials</h2>
        <p>Enter your new password below.</p>
        
        <form id="reset-password-form">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="password" required minlength="8">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm-password" required minlength="8">
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">Update Password</button>
        </form>

        <div id="message" style="margin-top: 15px; font-size: 0.9rem; display: none;"></div>
        
        <a href="/login.html" class="link">← Return to Login</a>
    </div>

    <script>
        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');
            const msgBox = document.getElementById('message');
            
            msgBox.style.display = 'none';

            if (password !== confirmPassword) {
                msgBox.style.display = 'block';
                msgBox.className = 'text-red';
                msgBox.innerText = 'Passwords do not match.';
                return;
            }

            // Extract the token from the URL query string (e.g., ?token=abc123xyz)
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                msgBox.style.display = 'block';
                msgBox.className = 'text-red';
                msgBox.innerText = 'Invalid or missing security token.';
                return;
            }
            
            btn.disabled = true;
            btn.innerText = 'UPDATING...';

            try {
                const response = await fetch(`/api/v1/auth/reset-password/${token}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newPassword: password })
                });

                const result = await response.json();

                msgBox.style.display = 'block';
                if (response.ok) {
                    msgBox.className = 'text-green';
                    msgBox.innerText = 'Password updated successfully. You can now log in.';
                    document.getElementById('reset-password-form').reset();
                } else {
                    msgBox.className = 'text-red';
                    msgBox.innerText = result.error || 'Failed to update password. Token may have expired.';
                }
            } catch (error) {
                msgBox.style.display = 'block';
                msgBox.className = 'text-red';
                msgBox.innerText = 'Network error occurred.';
            } finally {
                btn.disabled = false;
                btn.innerText = 'UPDATE PASSWORD';
            }
        });
    </script>
    <!-- Load the script at the bottom -->
    <script src="/js/reset-password.js"></script>
</body>
</html>
