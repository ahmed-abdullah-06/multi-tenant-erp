<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Multi-Tenant ERP</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 id="auth-title">Welcome Back</h1>
        <p id="auth-subtitle">Sign in to your organization account</p>
      </div>

      <div id="alert-message" class="alert-box alert-error"></div>

      <form id="auth-form">
        <div class="form-group" id="name-group" style="display: none;">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="Sarah Connor">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" required placeholder="admin@enterprise.com">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-input" required placeholder="••••••••" minlength="8">
            <button type="button" id="toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #64748b; font-size: 1.2rem; padding: 0; line-height: 1;" aria-label="Toggle password visibility">
              👁️
            </button>
          </div>
          <small style="display: block; margin-top: 0.25rem; color: #64748b; font-size: 0.875rem;">Minimum 8 characters</small>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-full">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: #64748b;">
        <span id="toggle-text">Don't have an account?</span>
        <button id="toggle-mode-btn" style="background: none; border: none; color: #2563eb; font-weight: 600; margin-left: 0.25rem;">
          Create organization
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
